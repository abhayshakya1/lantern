[project]
name = "lantern"
version = "0.3.0"
description = "Research and forecasting workspace: AI-bubble monitor, filings Q&A, research desk"
authors = [{ name = "Abhay Shakya" }]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = ["License :: Other/Proprietary License", "Programming Language :: Python :: 3.12", "Private :: Do Not Upload"]
requires-python = ">=3.12"
dependencies = [
  "pandas",
  "numpy",
  "scipy",
  "requests",
  "yfinance",
  "pyarrow",
  "fastapi",
  "uvicorn",
  "httpx",
  "openpyxl",
  "xlrd",
  "python-calamine",
  "pymupdf",
  "fastembed",
  "rank-bm25",
  "anthropic",
]

[project.optional-dependencies]
# timesfm: Apache-2.0 2.5 weights (the 3.0 checkpoint is non-commercial)
# tabpfn 2.0.x: HF-hosted weights under the Prior Labs license; 2.5+ needs a Prior Labs token
challenger = ["timesfm[torch]", "tabpfn==2.0.9"]

[project.scripts]
lantern = "lantern.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lantern*"]

[tool.pytest.ini_options]
markers = ["network: hits the internet"]
addopts = "-m 'not network'"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
