<!doctype html>
<html><head><meta charset="utf-8"><title>Lantern</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  html,body{margin:0;height:100%;background:#0E1117;color:#E8EBEF;font-family:'IBM Plex Sans',sans-serif;overflow:hidden}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;text-align:center}
  h1{font-family:'Source Serif 4',serif;font-weight:600;font-size:56px;margin:0;max-width:1100px;line-height:1.25;
     opacity:0;transform:translateY(12px);animation:in 1s .2s cubic-bezier(.2,.6,.2,1) forwards}
  .pts{display:flex;gap:44px;opacity:0;animation:fade 1s 1.2s forwards}
  .pt{font-size:20px;color:#9AA3AE}
  .pt b{display:block;color:#E8EBEF;font-size:26px;font-family:'Source Serif 4',serif;margin-bottom:6px}
  .brand{position:absolute;bottom:48px;font-family:'Source Serif 4',serif;font-size:22px;color:#596270;opacity:0;animation:fade 1s 2s forwards}
  @keyframes in{to{opacity:1;transform:none}}
  @keyframes fade{to{opacity:1}}
</style></head><body>
<div class="wrap">
  <h1>Research you can defend,<br>on infrastructure you control.</h1>
  <div class="pts">
    <div class="pt"><b>On-premise</b>data, models and keys stay in the building</div>
    <div class="pt"><b>Auditable</b>every number traces to a source and a hash</div>
    <div class="pt"><b>Measured</b>the models keep their own public scorecard</div>
  </div>
  <div class="brand">Lantern</div>
</div>
</body></html>
