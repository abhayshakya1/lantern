[project]
name = "lantern"
version = "0.3.0"
description = "Research and forecasting workspace: AI-bubble monitor, filings Q&A, research desk"
requires-python = ">=3.12"
dependencies = [
  "pandas",
  "numpy",
  "scipy",
  "requests",
  "yfinance",
  "pyarrow",
  "fastapi",
  "uvicorn",
  "httpx",
  "openpyxl",
  "xlrd",
  "python-calamine",
  "pymupdf",
  "fastembed",
  "rank-bm25",
]

[project.scripts]
lantern = "lantern.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lantern*"]

[tool.pytest.ini_options]
markers = ["network: hits the internet"]
addopts = "-m 'not network'"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
